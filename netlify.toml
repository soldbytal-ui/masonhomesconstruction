# Mason Homes Construction — Netlify build configuration
#
# When this repo is connected to Netlify (New site from Git → GitHub → this repo),
# Netlify will read this file and serve the `site/` directory.

[build]
  publish = "site"
  # No build command — this is a static HTML site.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache project photos aggressively (they don't change)
[[headers]]
  for = "/assets/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS/JS (there is none inline right now, but future-proof)
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Custom 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

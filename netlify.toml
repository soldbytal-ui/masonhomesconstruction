# Mason Homes Construction — Netlify build configuration
#
# When this repo is connected to Netlify (New site from Git → GitHub → this repo),
# Netlify will read this file and serve the `site/` directory.

[build]
  publish = "site"
  functions = "netlify/functions"
  # No build command — this is a static HTML site.

# ============ HEADERS ============

# Baseline security headers on every response
[[headers]]
  for = "/*"
  [headers.values]
    # Framing
    X-Frame-Options = "SAMEORIGIN"
    # Content-type sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer info leakage
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Feature access
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    # Enforce HTTPS on all subdomains, preload-eligible
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Cross-origin isolation
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP: allow own domain + Google Fonts + inline styles/scripts (static HTML site with inline CSS)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://www.google.com https://maps.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Aggressive caching for project photos (immutable, won't change)
[[headers]]
  for = "/assets/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Widget CSS/JS — cached hard
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons — long cache
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML — moderate cache with must-revalidate (so updates ship fast)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# sitemap.xml + robots.txt — short cache for crawler freshness
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ============ REDIRECTS ============

# Pretty API endpoint for admin CRM -> Netlify function
[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

# Custom 404 fallback (Netlify serves 404.html automatically for missing paths)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
